# BioFusion — nginx site for brainstorm.pasidumihiranga.me
#
# Routing:
#   /      -> Kiosk (Flask/gunicorn, :8503). Kept at root because its templates
#             hardcode absolute /api/ and /static/ paths.
#   /app   -> Streamlit (:8502), which rewrites its own URLs via --server.baseUrlPath.
#
# TLS lines are certbot-managed. deploy.sh refuses to install this file if the
# certificate is missing, so nginx -t cannot fail on a dangling cert path.

server {
    server_name brainstorm.pasidumihiranga.me;

    # X-ray uploads
    client_max_body_size 25M;

    access_log /var/log/nginx/biofusion.access.log;
    error_log  /var/log/nginx/biofusion.error.log;

    # ── Compression ──────────────────────────────────────────────────────────
    # Ubuntu's nginx.conf enables `gzip on` but leaves gzip_types commented out,
    # so only text/html was compressed. Streamlit's frontend is ~110 JS modules
    # totalling ~2MB uncompressed, which dominates load time on mobile.
    # gzip_proxied is required as well: these responses all come via proxy_pass,
    # and the default (off) skips compression for proxied responses entirely.
    # Scoped to this server block so the other vhosts are unaffected.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Deliberately not compressing woff2 or png/jpeg — already compressed.

    # ── Streamlit websocket ──────────────────────────────────────────────────
    # Split out from /app so that buffering can stay ON for everything else.
    location /app/_stcore/stream {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # ── Streamlit app + static assets ────────────────────────────────────────
    location /app {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        # Buffering on: lets nginx gzip whole responses and decouples the
        # single-threaded Tornado server from slow mobile clients.
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    # ── Kiosk ────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MJPEG preview stream must not be buffered
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brainstorm.pasidumihiranga.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brainstorm.pasidumihiranga.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = brainstorm.pasidumihiranga.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name brainstorm.pasidumihiranga.me;
    return 404; # managed by Certbot
}
