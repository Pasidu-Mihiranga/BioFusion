# BioFusion — nginx site for brainstorm.pasidumihiranga.me
# Install to /etc/nginx/sites-available/biofusion and symlink into sites-enabled.
#
# Routing:
#   /      -> Kiosk (Flask/gunicorn, :8503). Kept at root because its templates
#             hardcode absolute /api/ and /static/ paths.
#   /app   -> Streamlit (:8502), which rewrites its own URLs via --server.baseUrlPath.
#
# certbot appends the listen 443 block on first issuance.

server {
    listen 80;
    listen [::]:80;
    server_name brainstorm.pasidumihiranga.me;

    # X-ray uploads
    client_max_body_size 25M;

    access_log /var/log/nginx/biofusion.access.log;
    error_log  /var/log/nginx/biofusion.error.log;

    # ── Streamlit app ────────────────────────────────────────────────────────
    location /app {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # ── Kiosk ────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MJPEG preview stream must not be buffered
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
